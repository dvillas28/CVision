# Blueprint de Render para CVision (plan gratuito).
# Referencia: https://render.com/docs/blueprint-spec
#
# La base de datos vive en Neon (fuera de Render), por eso no se declara aquí.
# Las variables con `sync: false` se piden en el dashboard al crear el Blueprint
# y NO se vuelven a pedir en sincronizaciones posteriores.

projects:
  - name: cvision
    environments:
      - name: production
        services:
          - type: web
            name: cvision-api
            runtime: node
            plan: free
            # Debe coincidir con la región del proyecto en Neon (oregon <-> us-west-2).
            # No se puede cambiar después de crear el servicio.
            region: oregon
            rootDir: backend
            # `--include=dev` porque la CLI de Prisma es devDependency y NODE_ENV=production
            # haría que `npm ci` la omitiera. Las migraciones van en el build porque
            # preDeployCommand solo existe en planes pagos.
            buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              # Neon: URL pooled (host con -pooler) y URL directa, ambas con ?sslmode=require
              - key: DATABASE_URL
                sync: false
              - key: DIRECT_URL
                sync: false
              - key: JWT_ACCESS_SECRET
                generateValue: true
              - key: JWT_REFRESH_SECRET
                generateValue: true
              # URL del sitio estático, p. ej. https://cvision-web.onrender.com
              - key: CORS_ORIGIN
                sync: false
              - key: LOG_LEVEL
                value: info
              - key: GEMINI_API_KEY
                sync: false
              - key: AI_MODEL
                value: gemini-2.5-flash-lite
              # Respaldo opcional con Groq; dejar vacío para desactivarlo.
              - key: GROQ_API_KEY
                sync: false
              - key: AI_FALLBACK_MODEL
                value: openai/gpt-oss-120b
              - key: AI_RATE_LIMIT_PER_MINUTE
                value: "5"
              - key: AI_DAILY_LIMIT_PER_USER
                value: "30"

          - type: web
            name: cvision-web
            runtime: static
            rootDir: frontend
            buildCommand: npm ci && npm run build
            staticPublishPath: dist
            autoDeployTrigger: commit
            envVars:
              - key: NODE_VERSION
                value: "22"
              # Se resuelve en build time, p. ej. https://cvision-api.onrender.com/api
              - key: VITE_API_BASE_URL
                sync: false
            routes:
              # React Router: cualquier ruta sirve index.html
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /assets/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
              - path: /index.html
                name: Cache-Control
                value: no-cache
